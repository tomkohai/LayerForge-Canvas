<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - LayerForge Canvas</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <!-- BOUTON MENU MOBILE (désactivé en CSS mobile) -->
  <button class="mobile-menu-btn">☰ Menu</button>

 <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="{{ '/index.html' | relative_url }}" class="{% if page.url contains 'index' %}active{% endif %}">Accueil</a>
    <a href="{{ '/installation.html' | relative_url }}" class="{% if page.url contains 'installation' %}active{% endif %}">Installation</a>
    <a href="{{ '/modes.html' | relative_url }}" class="{% if page.url contains 'modes' %}active{% endif %}">Modes de travail</a>
    <a href="{{ '/materials.html' | relative_url }}" class="{% if page.url contains 'materials' %}active{% endif %}">Matériaux LF</a>
    <a href="{{ '/layers.html' | relative_url }}" class="{% if page.url contains 'layers' %}active{% endif %}">Layers</a>
    <a href="{{ '/outline.html' | relative_url }}" class="{% if page.url contains 'outline' %}active{% endif %}">Outline</a>
    <a href="{{ '/lineart.html' | relative_url }}" class="{% if page.url contains 'lineart' %}active{% endif %}">LineArt</a>
    <a href="{{ '/normalmap.html' | relative_url }}" class="{% if page.url contains 'normalmap' %}active{% endif %}">Normal Maps</a>
    <a href="{{ '/render.html' | relative_url }}" class="{% if page.url contains 'render' %}active{% endif %}">Rendu</a>
    <a href="{{ '/utilities.html' | relative_url }}" class="{% if page.url contains 'utilities' %}active{% endif %}">Utilitaires</a>
    <a href="{{ '/shortcuts.html' | relative_url }}" class="{% if page.url contains 'shortcuts' %}active{% endif %}">Raccourcis</a>
    <a href="{{ '/roadmap.html' | relative_url }}" class="{% if page.url contains 'roadmap' %}active{% endif %}">Roadmap</a>
</aside>


  <!-- HEADER -->
  <header class="header-custom">
    <button class="mobile-menu-btn">☰ Menu</button>
    <div class="header-inner">
      <img src="{{ '/assets/Logowhite_LayerForge Canvas.png' | relative_url }}" 
           alt="Logo LayerForge" 
           class="layerforge-logo">

      <img src="{{ '/assets/Blender-Logo.png' | relative_url }}" 
           alt="Logo Blender" 
           class="blender-logo">
    </div>
  </header>

  <!-- CONTENT -->
  <main class="page-content">
  <div class="lfc-center">
    {{ content }}
  </div>
</main>


  <!-- FOOTER -->
  <footer class="lf-footer">
    <p>LayerForge Canvas — Documentation officielle</p>
    <p>© 2026 To Kohai — Addon gratuit financé par des dons</p>

  <!-- SCRIPT MOBILE -->
  <script>
    document.querySelectorAll('.mobile-menu-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelector('.sidebar').classList.toggle('active');
      };
    });
  </script>

</body>
</html>
