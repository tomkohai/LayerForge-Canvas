<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - LayerForge Canvas</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <!-- BOUTON MENU MOBILE (désactivé en CSS mobile) -->
  <button class="mobile-menu-btn">☰ Menu</button>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="{{ '/index.html' | relative_url }}">Accueil</a>
    <a href="{{ '/installation.html' | relative_url }}">Installation</a>
    <a href="{{ '/modes.html' | relative_url }}">Modes de travail</a>
    <a href="{{ '/materials.html' | relative_url }}">Matériaux LF</a>
    <a href="{{ '/layers.html' | relative_url }}">Layers</a>
    <a href="{{ '/outline.html' | relative_url }}">Outline</a>
    <a href="{{ '/lineart.html' | relative_url }}">LineArt</a>
    <a href="{{ '/normalmap.html' | relative_url }}">Normal Maps</a>
    <a href="{{ '/render.html' | relative_url }}">Rendu</a>
    <a href="{{ '/utilities.html' | relative_url }}">Utilitaires</a>
    <a href="{{ '/shortcuts.html' | relative_url }}">Raccourcis</a>
    <a href="{{ '/roadmap.html' | relative_url }}">Roadmap</a>
  </aside>

  <!-- HEADER -->
  <header class="header-custom">
    <button class="mobile-menu-btn">☰ Menu</button>
    <div class="header-inner">
      <img src="{{ '/assets/Logowhite_LayerForge Canvas.png' | relative_url }}" 
           alt="Logo LayerForge" 
           class="layerforge-logo">

      <img src="{{ '/assets/Blender-Logo.png' | relative_url }}" 
           alt="Logo Blender" 
           class="blender-logo">
    </div>
  </header>

  <!-- CONTENT -->
  <main class="page-content">
    {{ content }}
  </main>

  <!-- SCRIPT MOBILE -->
  <script>
    document.querySelectorAll('.mobile-menu-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelector('.sidebar').classList.toggle('active');
      };
    });
  </script>

</body>
</html>
